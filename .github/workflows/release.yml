name: release

# Every push to main releases a .deb. The version is Cargo.toml's version
# plus the run number (e.g. 0.1.0-37), so each release is unique and Ansible
# can pin it without anyone hand-tagging.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # glibc and GStreamer must match the target box exactly (DESIGN.md §11).
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config git gh \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-x \
            fonts-inter fontconfig

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Lint and test (goldens included)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          PLACARD_GOLDENS=1 cargo test

      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          BASE=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          VERSION="$BASE-$GITHUB_RUN_NUMBER"
          cargo deb --deb-version "$VERSION"
          DEB=$(ls target/debian/placard_*.deb)
          # Bare filename in the .sha256 so Ansible's checksum URL matches.
          (cd target/debian && sha256sum "$(basename "$DEB")" > "$(basename "$DEB").sha256")
          echo "DEB=$DEB" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # No third-party actions: release via the GitHub CLI (Debian's gh
      # package) with the workflow's own token.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "v$VERSION" "$DEB" "$DEB.sha256" \
            --title "v$VERSION" --target "$GITHUB_SHA" --generate-notes
