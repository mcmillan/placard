name: release

# Every push to main releases a .deb. The version is Cargo.toml's version
# plus the run number (e.g. 0.1.0-37), so each release is unique and Ansible
# can pin it without anyone hand-tagging.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

# The repo default keeps workflow tokens read-only; grants here are exactly
# what the steps use. contents:write covers checkout plus creating the
# release, its tag and its assets; pull-requests:read is for
# `gh release create --generate-notes`, which summarises the pull requests
# behind each commit and 403s the whole create call without it;
# packages:read pulls the build container from GHCR. The cache step uses
# the runner's cache service, not this token.
permissions:
  contents: write
  pull-requests: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The prebuilt build environment (Dockerfile.build via build-image.yml):
    # trixie so glibc and GStreamer match the target box, with the toolchain
    # and cargo-deb baked in — per-run compilation is the project only.
    container:
      image: ghcr.io/mcmillan/placard-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # CARGO_HOME is /root/.cargo (image ENV), not $HOME — cache that.
      # Split restore/save with an unconditional save: the default combined
      # action only saves on job success, so a failing step after the build
      # would keep every next run on a cold cache. restore-keys lets a
      # changed Cargo.lock start from the previous cache instead of scratch.
      - uses: actions/cache/restore@v6
        id: cargo-cache
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-

      - name: Lint and test (goldens included)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          PLACARD_GOLDENS=1 cargo test

      - name: Build .deb
        run: |
          BASE=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          VERSION="$BASE-$GITHUB_RUN_NUMBER"
          cargo deb --deb-version "$VERSION"
          DEB=$(ls target/debian/placard_*.deb)
          # Bare filename in the .sha256 so Ansible's checksum URL matches.
          (cd target/debian && sha256sum "$(basename "$DEB")" > "$(basename "$DEB").sha256")
          echo "DEB=$DEB" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # No third-party actions. The create call goes through curl so the
      # API's full error body is visible if it fails; assets upload
      # separately once the release exists.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          printf '{"tag_name":"v%s","target_commitish":"%s","name":"v%s","generate_release_notes":true}' \
            "$VERSION" "$GITHUB_SHA" "$VERSION" > /tmp/body.json
          CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/body.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases")
          echo "create release: HTTP $CODE"
          cat /tmp/resp.json
          [ "$CODE" = "201" ]
          gh release upload "v$VERSION" "$DEB" "$DEB.sha256"

      # Save even when a later step failed — compiled dependencies are worth
      # keeping either way. Skip only when this exact key was already hit.
      - uses: actions/cache/save@v6
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
