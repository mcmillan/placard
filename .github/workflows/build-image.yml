name: build-image

# Rebuilds the CI/build container only when its definition changes. The
# release workflow runs inside this image so it never apt-installs a
# toolchain or compiles cargo-deb per run.
on:
  push:
    branches: [main]
    paths: [Dockerfile.build, .github/workflows/build-image.yml]
  workflow_dispatch:

# Overlapping builds would race on the :latest tag, and whichever run
# finishes last wins — not whichever commit is newest. Only the newest
# definition matters, so supersede in-flight builds outright.
concurrency:
  group: build-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/placard-build
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Explicit platform: the release job consuming this image runs on
          # amd64, and a cached base image must never decide the arch
          # silently (e.g. if this job ever moves to an arm runner).
          docker build --platform linux/amd64 -t "$IMAGE:latest" -f Dockerfile.build .
          docker push "$IMAGE:latest"
