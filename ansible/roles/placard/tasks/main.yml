---
- name: Look up the release to install
  ansible.builtin.uri:
    url: >-
      {{ 'https://api.github.com/repos/' + placard_repo + '/releases/latest'
         if placard_release == 'latest'
         else 'https://api.github.com/repos/' + placard_repo + '/releases/tags/' + placard_release }}
    return_content: true
  register: placard_release_info
  check_mode: false

- name: Resolve the .deb and checksum assets
  ansible.builtin.set_fact:
    placard_deb_asset: "{{ placard_release_info.json.assets | selectattr('name', 'search', '\\.deb$') | first }}"
    placard_sha_asset: "{{ placard_release_info.json.assets | selectattr('name', 'search', '\\.sha256$') | first }}"

- name: "Download {{ placard_deb_asset.name | default('placard .deb') }} (checksum-verified)"
  ansible.builtin.get_url:
    url: "{{ placard_deb_asset.browser_download_url }}"
    checksum: "sha256:{{ placard_sha_asset.browser_download_url }}"
    dest: "/var/cache/{{ placard_deb_asset.name }}"
    mode: "0644"
  register: placard_deb

- name: Install placard (apt resolves the GStreamer runtime dependencies)
  ansible.builtin.apt:
    deb: "/var/cache/{{ placard_deb_asset.name }}"
  when: placard_deb is changed or placard_force_install | default(false)
  notify: Restart placard

- name: Pin the installed version against accidental apt changes
  ansible.builtin.dpkg_selections:
    name: placard
    selection: hold

- name: Template /etc/placard/config.toml
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/placard/config.toml
    mode: "0644"
  notify: Restart placard

- name: Enable and start placard
  ansible.builtin.systemd_service:
    name: placard
    enabled: true
    state: started
