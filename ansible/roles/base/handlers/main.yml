---
- name: Update grub
  ansible.builtin.command: update-grub
  changed_when: true

- name: Reboot for cmdline
  ansible.builtin.reboot:
    reboot_timeout: 120

- name: Reexec systemd
  ansible.builtin.systemd_service:
    daemon_reexec: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Restart sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
