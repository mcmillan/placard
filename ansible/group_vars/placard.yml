---
# GitHub repo the .deb is released from (owner/name).
placard_repo: mcmillan/placard

# LAN NTP server; pool.ntp.org remains as fallback. Override per venue.
ntp_server: 192.168.10.1

# Wall-clock timezone shown on screen. The system timezone stays UTC.
placard_timezone: Europe/London

placard_display:
  width: 1920
  height: 1080
  font: "Inter Bold 120"
  padding_x: 96
  padding_y: 64

placard_net:
  osc_port: 9000
  tcp_port: 9001
  http_port: 8080

placard_clock:
  font: "Inter Semibold 40"
  position: bottom-right

placard_defaults:
  bg: "000000"
  fg: "ffffff"
  boot_scene: house_closed

# The ids are the contract — QLab cues reference them. Colours are rrggbb.
placard_canned:
  house_closed:
    text: "HOUSE CLOSED"
    bg: "8a0000"
  house_open:
    text: "HOUSE OPEN"
    bg: "0b6e2e"
  five_minute:
    text: "5 MINUTE WARNING"
    bg: "b36b00"
  awaiting_clearance:
    text: "AWAITING CLEARANCE"
    bg: "b36b00"
  go:
    text: "GO"
    bg: "0b6e2e"
  show_stop:
    text: "SHOW STOP"
    bg: "8a0000"
    flash: true
  cans_on:
    text: "PUT YOUR CANS ON"
    bg: "1f4e9e"
